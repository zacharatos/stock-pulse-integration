<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Stock Pulse Card – test harness</title>
<script src="icons.js"></script>
<style>
  :root {
    --primary-color: #03a9f4;
    --primary-text-color: #212121;
    --secondary-text-color: #727272;
    --text-primary-color: #ffffff;
    --card-background-color: #ffffff;
    --divider-color: #e0e0e0;
    --orange-color: #ff9800; --red-color: #f44336; --green-color: #4caf50;
    --ha-card-border-radius: 12px;
    font-family: Roboto, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { margin: 0; padding: 24px; background: #fafafa; }
  body.dark {
    --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b;
    --card-background-color: #1c1c1c; --divider-color: rgba(225,225,225,.12);
    background: #111111;
  }
  .grid { display: grid; grid-template-columns: repeat(3, 380px); gap: 16px; align-items: start; }
  .cap { font: 12px system-ui; color: var(--secondary-text-color); margin: 0 0 6px 2px; }
  #log { font: 12px monospace; color: var(--secondary-text-color); margin-top: 16px; white-space: pre-wrap; }
  @media (max-width: 700px) { body { padding: 12px; } .grid { grid-template-columns: minmax(0, 1fr); } }
</style>
<script>
  // --- Stubs for HA's own elements -------------------------------------------------
  class HaIcon extends HTMLElement {
    static get observedAttributes() { return ["icon"]; }
    set icon(v) { this._icon = v; this.draw(); } get icon() { return this._icon; }
    attributeChangedCallback() { this._icon = this.getAttribute("icon"); this.draw(); }
    connectedCallback() { this.style.display = "inline-flex"; this.draw(); }
    draw() {
      if (!this.shadowRoot) this.attachShadow({ mode: "open" });
      const p = window.MDI[this._icon];
      const s = "var(--mdc-icon-size, 24px)";
      this.shadowRoot.innerHTML = p ? `<svg viewBox="0 0 24 24" style="width:${s};height:${s};fill:currentColor"><path d="${p}"/></svg>` : `<span style="width:${s};height:${s};display:inline-block;background:red"></span>`;
    }
  }
  customElements.define("ha-icon", HaIcon);
  class HaCard extends HTMLElement {
    constructor() { super(); this.attachShadow({ mode: "open" }).innerHTML = `<style>:host{display:block;background:var(--ha-card-background,var(--card-background-color));
      border-radius:var(--ha-card-border-radius,12px);border:var(--ha-card-border-width,1px) solid var(--ha-card-border-color,var(--divider-color));
      color:var(--primary-text-color);box-sizing:border-box;box-shadow:var(--ha-card-box-shadow,none);-webkit-backdrop-filter:var(--ha-card-backdrop-filter,none);backdrop-filter:var(--ha-card-backdrop-filter,none)}</style><slot></slot>`; }
  }
  customElements.define("ha-card", HaCard);

  // A tiny ha-form: enough to show the fields and send value-changed like the real one.
  class HaForm extends HTMLElement {
    set schema(v) { this._schema = v; this.draw(); }
    set data(v) { this._data = { ...v }; if (!this._drawn) this.draw(); }
    set hass(v) {}
    connectedCallback() { this.draw(); }
    draw() {
      if (!this._schema || !this._data) return;
      this._drawn = true;
      const label = (f) => (this.computeLabel ? this.computeLabel(f) : f.name);
      const helper = (f) => (this.computeHelper ? this.computeHelper(f) || "" : "");
      const field = (f) => {
        const v = this._data[f.name] ?? "";
        const sel = f.selector || {};
        let input;
        if (sel.boolean) input = `<input type="checkbox" data-n="${f.name}" ${v ? "checked" : ""}>`;
        else if (sel.number) input = `<input type="number" step="any" data-n="${f.name}" value="${v}">`;
        else if (sel.date) input = `<input type="date" data-n="${f.name}" value="${v}">`;
        else if (sel.select) input = `<input list="dl-${f.name}" data-n="${f.name}" value="${(sel.select.options.find(o => o.value === v)||{}).label ?? v}"><datalist id="dl-${f.name}">${sel.select.options.map(o => `<option value="${o.label}">`).join("")}</datalist>`;
        else if (sel.text && sel.text.multiline) input = `<textarea data-n="${f.name}" rows="2">${v}</textarea>`;
        else input = `<input data-n="${f.name}" value="${v}">`;
        const h = helper(f);
        return `<label class="${sel.boolean ? "b" : ""}"><span>${label(f)}</span>${input}${h ? `<small>${h}</small>` : ""}</label>`;
      };
      const body = this._schema.map((s) => s.type === "grid" ? `<div class="g">${s.schema.map(field).join("")}</div>` : field(s)).join("");
      this.innerHTML = `<style>
        ha-form{display:flex;flex-direction:column;gap:12px}
        ha-form .g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px} ha-form input,ha-form textarea{min-width:0}
        ha-form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--secondary-text-color)}
        ha-form label.b{flex-direction:row-reverse;justify-content:flex-end;align-items:center;gap:10px;font-size:14px;color:var(--primary-text-color)}
        ha-form input:not([type=checkbox]),ha-form textarea{font:inherit;font-size:15px;padding:14px 12px;border-radius:4px 4px 0 0;border:none;border-bottom:1px solid var(--secondary-text-color);
          background:color-mix(in srgb,var(--primary-text-color) 5%,transparent);color:var(--primary-text-color)}
        ha-form small{font-size:11px}
      </style>` + body;
      const flat = this._schema.flatMap((s) => s.type === "grid" ? s.schema : [s]);
      this.querySelectorAll("[data-n]").forEach((el) => el.addEventListener("input", () => {
        const f = flat.find((x) => x.name === el.dataset.n);
        let v = el.type === "checkbox" ? el.checked : el.value;
        if (f.selector.number) v = v === "" ? undefined : Number(v);
        if (f.selector.select) { const o = f.selector.select.options.find((o) => o.label === v); if (o) v = o.value; }
        if (v === "") v = undefined;
        this._data = { ...this._data, [f.name]: v };
        this.dispatchEvent(new CustomEvent("value-changed", { detail: { value: this._data }, bubbles: true, composed: true }));
      }));
    }
  }
  customElements.define("ha-form", HaForm);
  customElements.define("ha-selector", class extends HTMLElement {});
</script>
<script type="module">

  // ?theme=pulse|glass|tonal applies a Pulse theme from the sibling pulse-theme repo, the way HA does.
  {
    const q = new URLSearchParams(location.search);
    if (q.get("theme")) {
      const { applyPulseTheme } = await import("../../pulse-theme/test/apply-theme.mjs");
      await applyPulseTheme(q.get("theme"), q.has("dark"), document.body);
      document.body.style.background = "var(--lovelace-background, var(--primary-background-color))";
      document.body.style.fontFamily = "var(--ha-font-family-body)";
    }
  }
  const params = new URLSearchParams(location.search);
  if (params.has("dark")) document.body.classList.add("dark");
  const day = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
  let n = 0;
  const item = (name, extra) => ({
    id: `i${++n}`, name, quantity: 1, unit: "pcs", category: null, location: null, expiry: null,
    min_quantity: null, restock_quantity: null, auto_shop: true, notes: null, icon: null,
    created: "", updated: "", shopping: null, shopping_dismissed: false, ...extra,
  });
  const items = [
    item("Toilet paper", { quantity: 2, unit: "roll", category: "toiletries", location: "bathroom", min_quantity: 2, restock_quantity: 9,
      shopping: { uid: "u1", summary: "Toilet paper (9 rolls)", amount: 9, auto: true } }),
    item("Shampoo", { quantity: 1, unit: "bottle", category: "toiletries", location: "bathroom", min_quantity: 0 }),
    item("Dishwasher tablets", { quantity: 38, unit: "pcs", category: "cleaning", location: "cleaning", min_quantity: 10 }),
    item("Laundry detergent", { quantity: 0, unit: "bottle", category: "cleaning", location: "cleaning", min_quantity: 0,
      shopping: { uid: "u2", summary: "Laundry detergent", amount: 1, auto: true } }),
    item("Spaghetti", { quantity: 3, unit: "pack", category: "food", location: "pantry", min_quantity: 1 }),
    item("Basmati rice", { quantity: 1.5, unit: "kg", category: "food", location: "pantry", expiry: day(140) }),
    item("Olive oil", { quantity: 1, unit: "bottle", category: "food", location: "pantry", min_quantity: 1 }),
    item("Greek yoghurt", { quantity: 2, unit: "pcs", category: "food", location: "fridge", expiry: day(1) }),
    item("Feta", { quantity: 400, unit: "g", category: "food", location: "fridge", expiry: day(-2), restock_quantity: 400, barcodes: ["5202576461208"] }),
    item("Milk", { quantity: 1, unit: "bottle", category: "drinks", location: "fridge", min_quantity: 1, expiry: day(4) }),
    item("Smoked turkey", { quantity: 2, unit: "pack", category: "food", location: "fridge", expiry: day(77), opened_on: day(-8), days_after_opening: 10 }),
    item("Peas", { quantity: 2, unit: "bag", category: "frozen", location: "freezer", expiry: day(200) }),
    item("Chicken souvlaki", { quantity: 6, unit: "pcs", category: "frozen", location: "freezer", expiry: day(3) }),
    item("Vanilla ice cream", { quantity: 1, unit: "box", category: "frozen", location: "freezer" }),
    item("Light bulbs", { quantity: 4, unit: "pcs", category: "household", location: "other", min_quantity: 1 }),
  ];
  // ?batches=1 turns the inventory's Batches option on and adds an item that holds two dates.
  const batchesOn = params.has("batches");
  if (batchesOn) items.push(item("Minced beef", { quantity: 3, unit: "pack", category: "frozen", location: "freezer", expiry: day(2),
    batches: [{ quantity: 1, expiry: day(2) }, { quantity: 2, expiry: day(40) }] }));
  const snap = () => ({
    entry_id: "e1", title: "Home", version: "0.1.0", items: [...items].sort((a, b) => a.name.localeCompare(b.name)),
    settings: { shopping_list: "todo.shopping_list", auto_add: true, auto_restock: true, expiring_days: 3, ...(batchesOn ? { batches: true } : {}) },
    units: ["pcs","pack","roll","bottle","can","box","bag","jar","kg","g","l","ml"],
    locations: ["pantry","fridge","freezer","bathroom","cleaning","other"],
    categories: ["food","drinks","frozen","cleaning","toiletries","household","baby","pets","medicine","other"],
  });
  const subs = new Set();
  const push = () => subs.forEach((cb) => cb(snap()));
  const log = (m) => (document.getElementById("log").textContent += m + "\n");
  // The integration's rule (logic.py open_pack_finished): using up the open pack drops its Opened date.
  const openPackFinished = (i, before, after) => {
    if (!i.opened_on) return false;
    if (before <= 0) return after > 0;
    if (after >= before) return false;
    if (after <= 0) return true;
    const measured = ["kg", "g", "l", "ml"].includes(i.unit || "pcs");
    const size = measured ? (i.restock_quantity > 0 ? i.restock_quantity : null) : 1;
    const packs = (q) => (q > 0 ? Math.ceil(Math.round((q / size) * 1e6) / 1e6) : 0);
    return size != null && packs(after) < packs(before);
  };
  // The integration's batch rules (logic.py), a short copy for the mock: stock_changes and what it uses.
  const dayOf = (v) => (v ? String(v).slice(0, 10) : null);
  const r3 = (n) => Math.round(n * 1000) / 1000;
  const normB = (bs) => {
    const m = new Map();
    for (const b of bs || []) { const q = r3(Number(b.quantity) || 0); if (q > 0) m.set(dayOf(b.expiry), r3((m.get(dayOf(b.expiry)) || 0) + q)); }
    return [...m].sort(([a], [b]) => (a === null) - (b === null) || ((a || "") < (b || "") ? -1 : (a || "") > (b || "") ? 1 : 0)).map(([expiry, quantity]) => ({ quantity, expiry }));
  };
  const batchesOf = (i) => ((i.batches || []).length >= 2 ? i.batches.map((b) => ({ ...b })) : [{ quantity: i.quantity, expiry: dayOf(i.expiry) }]);
  const totalB = (bs) => r3(bs.reduce((s, b) => s + b.quantity, 0));
  const takeB = (bs, amount) => { let left = r3(amount); const kept = []; for (const b of normB(bs)) { if (left >= b.quantity) left = r3(left - b.quantity); else { kept.push({ ...b, quantity: r3(b.quantity - left) }); left = 0; } } return kept; };
  const putB = (bs, amount, expiry) => { const r = normB(bs), d = dayOf(expiry), t = d ? r.find((b) => b.expiry === d) : r[r.length - 1]; if (t) t.quantity = r3(t.quantity + amount); else r.push({ quantity: r3(amount), expiry: d }); return normB(r); };
  const fieldsB = (bs) => { const r = normB(bs); return r.length >= 2 ? { batches: r, quantity: totalB(r), expiry: r[0].expiry } : r.length ? { batches: [], quantity: r[0].quantity, expiry: r[0].expiry } : { batches: [], quantity: 0 }; };
  const stockChanges = (it, ch) => {
    const has = (it.batches || []).length >= 2;
    if ("batches" in ch || (has && ("quantity" in ch || "expiry" in ch))) {
      const before = normB(batchesOf(it));
      let first = before.length ? before[0].expiry : dayOf(it.expiry), after;
      if ("batches" in ch) after = normB(ch.batches);
      else {
        after = before;
        if ("expiry" in ch) { first = dayOf(ch.expiry); after = normB([{ ...after[0], expiry: first }, ...after.slice(1)]); }
        if ("quantity" in ch) { const total = totalB(after), want = r3(ch.quantity); after = want < total ? takeB(after, total - want) : want > total ? putB(after, want - total) : after; }
      }
      const out = {}; for (const k in ch) if (!["batches", "quantity", "expiry"].includes(k)) out[k] = ch[k];
      Object.assign(out, fieldsB(after));
      const ta = totalB(after), tb = totalB(before);
      const done = !("opened_on" in ch) && (tb <= 0 ? openPackFinished({ ...it, ...out }, 0, ta) : ta < tb && openPackFinished({ ...it, ...out }, before[0].quantity, (after.find((b) => b.expiry === first) || { quantity: 0 }).quantity));
      if (done) out.opened_on = null;
      return out;
    }
    if ("quantity" in ch && !("opened_on" in ch) && openPackFinished({ ...it, ...ch }, it.quantity, ch.quantity)) return { ...ch, opened_on: null };
    return ch;
  };
  const lowNow = (i) => i.min_quantity != null && i.quantity <= i.min_quantity;
  const hass = {
    language: params.get("lang") || "en", locale: { language: params.get("lang") || "en" }, states: {},
    themes: { darkMode: params.has("dark") },
    connection: {
      subscribeMessage: async (cb, msg) => { log(JSON.stringify(msg)); subs.add(cb); setTimeout(() => cb(snap()), 50); return () => subs.delete(cb); },
    },
    callWS: async (msg) => {
      log(JSON.stringify(msg));
      const find = () => items.find((i) => i.id === msg.item_id);
      if (msg.type === "stock_pulse/inventories") return [{ entry_id: "e1", title: "Home" }];
      if (msg.type === "stock_pulse/item/add") {
        const it = item(msg.item.name, msg.item);
        if (msg.item.batches) Object.assign(it, fieldsB(msg.item.batches));
        items.push(it); push(); return it;
      }
      if (msg.type === "stock_pulse/item/update") {
        const it = find();
        Object.assign(it, stockChanges(it, msg.changes)); push(); return it;
      }
      if (msg.type === "stock_pulse/item/remove") { items.splice(items.indexOf(find()), 1); push(); return null; }
      if (msg.type === "stock_pulse/item/adjust") {
        const it = find();
        // A date on added stock joins the batch with that date, or starts one.
        Object.assign(it, stockChanges(it, msg.expiry && msg.amount > 0 ? { batches: putB(batchesOf(it), msg.amount, msg.expiry) } : { quantity: Math.max(0, r3(it.quantity + msg.amount)) }));
        if (lowNow(it) && !it.shopping) it.shopping = { uid: "x", summary: it.name, amount: 1, auto: true };
        if (!lowNow(it) && it.shopping?.auto) it.shopping = null;
        push(); return it;
      }
      if (msg.type === "stock_pulse/item/lookup") {
        // Known in the inventory, found in Open Food Facts, or unknown: like the integration answers.
        const code = msg.barcode.replace(/[\s-]/g, "");
        const known = items.find((i) => (i.barcodes || []).includes(code));
        if (known) return { barcode: code, item_id: known.id, product: null, source: null, error: null };
        if (code === "5208069003184") return { barcode: code, item_id: null, source: "openfoodfacts", error: null,
          product: { name: "Βιτάμ Soft light", category: "food", notes: "225 g", image: null } };
        return { barcode: code, item_id: null, product: null, source: null, error: null };
      }
      if (msg.type === "stock_pulse/item/shop") { const it = find(); it.shopping = msg.on ? { uid: "m", summary: it.name, amount: 1, auto: false } : null; push(); return it; }
      throw { code: "unknown_command", message: "Unknown command" };
    },
  };
  // ?native=1: the companion app's own scanner. Answers a scan with the Open Food Facts example barcode,
  // and checks that the frontend's own command handler is put back and still receives the command.
  if (params.has("native")) {
    const frontendHandler = (msg) => { log("frontend handler got " + msg.command); return true; };
    const bus = {
      config: { hasBarCodeScanner: 1 }, _commandHandler: frontendHandler,
      addCommandHandler(h) { this._commandHandler = h; },
      fireMessage(msg) {
        log("to app: " + JSON.stringify(msg));
        if (msg.type === "bar_code/scan") setTimeout(() => {
          this._commandHandler({ type: "command", id: 7, command: "bar_code/scan_result", payload: { rawValue: params.get("native") === "qr" ? "https://example.com" : "5208069003184", format: "ean_13" } });
          log("handler restored: " + (this._commandHandler === frontendHandler));
        }, 300);
      },
    };
    hass.auth = { external: bus };
  }
  window.hass = hass;
  await import("../custom_components/stock_pulse/frontend/stock-pulse-card.js");
  const configs = [
    ["Default (grouped by category)", { type: "custom:stock-pulse-card" }],
    ["Freezer only, sorted by date", { type: "custom:stock-pulse-card", title: "Freezer", icon: "mdi:snowflake", locations: ["freezer"], group_by: "none", sort: "expiry" }],
    ["Compact, by location, max height", { type: "custom:stock-pulse-card", compact: true, group_by: "location", show_search: false, max_height: "420px" }],
    ["Nothing to act on", { type: "custom:stock-pulse-card", title: "Household", icon: "mdi:home-variant-outline", categories: ["household"], group_by: "none", show_search: false }],
    ["Category chips", { type: "custom:stock-pulse-card", filter_by: "category" }],
  ];
  const grid = document.getElementById("grid");
  for (const [cap, config] of configs) {
    const wrap = document.createElement("div");
    wrap.innerHTML = `<div class="cap">${cap}</div>`;
    const card = document.createElement("stock-pulse-card");
    card.setConfig(config);
    card.hass = hass;
    wrap.appendChild(card);
    grid.appendChild(wrap);
  }
  // ?sheet=<item name> opens that item's edit sheet on the first card (for screenshots).
  if (params.get("sheet")) {
    const card = grid.querySelector("stock-pulse-card");
    setTimeout(() => card._openEdit(items.find((i) => i.name === params.get("sheet"))), 200);
  }
  // ?scan=<digits> acts as if that barcode was scanned on the first card (known: 5202576461208 Feta,
  // found online: 5208069003184, anything else: unknown). ?scanner=1 opens the scanner itself.
  if (params.get("scan")) {
    const card = grid.querySelector("stock-pulse-card");
    setTimeout(() => card._onScanned(params.get("scan")), 200);
  }
  if (params.has("scanner")) {
    const card = grid.querySelector("stock-pulse-card");
    setTimeout(() => card._openScan(), 200);
  }
  if (params.has("missing")) {
    const wrap = document.createElement("div");
    wrap.innerHTML = `<div class="cap">Integration missing</div>`;
    const card = document.createElement("stock-pulse-card");
    card.setConfig({ type: "custom:stock-pulse-card" });
    card.hass = { ...hass, connection: { subscribeMessage: () => Promise.reject({ code: "unknown_command", message: "x" }) } };
    wrap.appendChild(card);
    grid.appendChild(wrap);
  }
</script>
</head>
<body>
  <div class="grid" id="grid"></div>
  <div id="log"></div>
</body>
</html>
